[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["shared", "nodes", "api_gateway"]
omit = [
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "core_framework/*",
]

[tool.coverage.report]
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
]

# ---------------------------------------------------------------------------
# Build tools
# ---------------------------------------------------------------------------

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"
